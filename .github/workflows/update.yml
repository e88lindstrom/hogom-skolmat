name: Uppdatera skolmat RSS
on:
  schedule:
    - cron: '15 5,9,12 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hamta dagens mat
        run: python generate_rss.py
      - name: Publicera uppdaterad RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/skolmat.xml docs/skolmat.json
          if ! git diff --cached --quiet; then
            git commit -m "Uppdatera dagens skolmat"
            git push
          fi
