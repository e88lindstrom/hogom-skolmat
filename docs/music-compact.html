<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Musikpanel</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;padding:0;overflow:hidden;background:#1f1e22;color:#f5f3f1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{padding:9px 12px}.wrap{display:flex;align-items:center;gap:12px;min-height:92px}.art{width:52px;height:52px;flex:none;border-radius:11px;background:linear-gradient(135deg,#2b5940,#2b3545);display:grid;place-items:center;color:#1ed760;font-size:27px}.info{min-width:0;flex:1}.title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:11px;color:#aaa7ad;margin-top:4px}.status{font-size:10px;color:#9bdda9;margin-top:5px}.buttons{display:flex;gap:7px;align-items:center}.buttons button{border:0;border-radius:50%;width:32px;height:32px;background:#39383f;color:white;font-size:16px;opacity:.45}.buttons button.play{background:#1ed760;color:#152118;width:38px;height:38px}.note{font-size:10px;color:#aaa7ad;margin-top:3px}@media(max-width:390px){body{padding:7px 8px}.wrap{gap:7px}.art{width:40px;height:40px}.buttons{gap:4px}.buttons button{width:26px;height:26px}.buttons button.play{width:30px;height:30px}.title{font-size:12px}.sub{font-size:10px}}</style></head><body><div class="wrap"><div class="art">♫</div><div class="info"><div class="title">Musik hemma</div><div class="sub">NestHub · Kök</div><div class="status">Förhandsversion</div><div class="note">Styrning kopplas in senare</div></div><div class="buttons"><button disabled aria-label="Föregående">⏮</button><button class="play" disabled aria-label="Spela">▶</button><button disabled aria-label="Nästa">⏭</button></div></div></body></html>
